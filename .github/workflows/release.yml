name: Release Masquerade

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.7009)'
        required: true
        type: string
      release_windows:
        description: 'Include Windows in Emulator PR'
        required: false
        type: boolean
        default: true
      release_linux:
        description: 'Include Linux in Emulator PR'
        required: false
        type: boolean
        default: true
      release_emscripten:
        description: 'Include Emscripten in Emulator PR'
        required: false
        type: boolean
        default: true
      release_macos:
        description: 'Include macOS in Emulator PR (not yet supported — keep unchecked)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

# ─────────────────────────────────────────────────────────────────────────────
# BUMP VERSION
# Creates branch release/<version> in Masquerade-Source, patches helpers.h,
# opens PR #1, and uploads the assets artifact.
# All build jobs check out this branch — NOT master.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  bump_version:
    name: Bump VERSION macro in helpers.h
    runs-on: ubuntu-latest
    outputs:
      source_branch: ${{ steps.branch.outputs.name }}

    steps:
      - name: Checkout Masquerade-Source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.EMULATOR_REPO_PAT }}
          fetch-depth: 0

      - name: Compute branch name
        id: branch
        run: echo "name=release/${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Create release branch
        run: git checkout -b "${{ steps.branch.outputs.name }}"

      - name: Update VERSION macro
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FILE="helpers/helpers.h"
          sed -i "s|#define VERSION\s\+static_cast<float>([0-9.]\+)|#define VERSION                                     static_cast<float>(${VERSION})|" "$FILE"
          echo "--- Updated line ---"
          grep "define VERSION" "$FILE"

      - name: Commit and push release branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helpers/helpers.h
          git commit -m "chore: bump VERSION to ${{ github.event.inputs.version }}"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets/
          if-no-files-found: error

      - name: Open PR #1 in Masquerade-Source
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          gh pr create \
            --repo "Kotambail-Hegde/Masquerade-Source" \
            --title "Release ${{ github.event.inputs.version }}: bump VERSION macro" \
            --body "## Version bump: \`${{ github.event.inputs.version }}\`

          Updates \`helpers/helpers.h\`:
          \`\`\`cpp
          #define VERSION    static_cast<float>(${{ github.event.inputs.version }})
          \`\`\`

          All three platforms (Windows, Linux, Emscripten) are building against this branch.

          _Merging this PR will automatically trigger \`update-submodule.yml\` which will
          update the submodule in the Emulator PR and unblock its merge._

          _Auto-created by the release workflow triggered by @${{ github.actor }}_" \
            --base master \
            --head "${{ steps.branch.outputs.name }}"

# ─────────────────────────────────────────────────────────────────────────────
# WINDOWS BUILD  — always runs
# ─────────────────────────────────────────────────────────────────────────────
  build_windows:
    name: Build Windows (MSVC)
    needs: bump_version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.source_branch }}
          submodules: recursive

      - name: Export git commit hash
        run: echo "GIT_COMMIT_HASH=$env:GITHUB_SHA" >> $env:GITHUB_ENV
        shell: pwsh

      # --- Cache all external dependencies
      # v16: b2 auto-detects MSVC version via _MSC_VER mapping, but VS 2026
      # (MSVC 19.51) isn't in Boost 1.89's mapping table so b2 falls back to
      # the bogus "msvc-6.0" tag. This produces paths like:
      #   bin.v2\libs\foo\build\msvc-6.0\release\address-model-64\link-static\...
      # which overflow cmd.exe's 8191-char limit on msvc.archive/msvc.link.dll,
      # causing "filename syntax incorrect" on every lib. Fix: write a
      # user-config.jam that explicitly sets "using msvc : 14.4 ;" with the
      # resolved cl.exe path, bypassing the broken auto-detection entirely.
      - name: Cache external dependencies
        id: cache-external
        uses: actions/cache@v4
        with:
          path: |
            external/imgui
            external/miniz
            external/stb
            external/rapidjson
            external/boost
            external/SDL
            external/nativefiledialog-extended
          key: windows-external-all-v16-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            windows-external-all-v16-

      - name: Clone all dependencies
        if: steps.cache-external.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $externalDir = "external"
          if (-not (Test-Path $externalDir)) { New-Item -ItemType Directory -Path $externalDir | Out-Null }

          cd external

          if (-not (Test-Path "imgui")) {
              git clone https://github.com/ocornut/imgui.git --branch docking --depth 1
          }

          if (-not (Test-Path "miniz")) {
              Write-Host "=== MINIZ: not found, downloading ==="
              $url = "https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip"
              $zip = "miniz-3.0.2.zip"
              $tmpDir = "_miniz_extract"
              Invoke-WebRequest -Uri $url -OutFile $zip
              if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
              Expand-Archive $zip -DestinationPath $tmpDir -Force
              if (Test-Path "miniz") { Remove-Item -Recurse -Force "miniz" }
              Move-Item -Path $tmpDir -Destination "miniz"
              Remove-Item -Path $zip -Force
              Write-Host "=== MINIZ setup complete ==="
          } else {
              Write-Host "=== MINIZ already exists, skipping ==="
          }

          if (-not (Test-Path "stb/stb")) {
              git clone https://github.com/nothings/stb.git --depth 1 stb/stb
          }

          if (-not (Test-Path "rapidjson")) {
              git clone https://github.com/Tencent/rapidjson.git --depth 1 rapidjson
          }

          if (-not (Test-Path "SDL")) {
              git clone https://github.com/libsdl-org/SDL.git --depth 1 SDL
          }

          if (-not (Test-Path "nativefiledialog-extended")) {
              git clone https://github.com/btzy/nativefiledialog-extended.git --depth 1 --recurse-submodules --shallow-submodules
          }

          if (-not (Test-Path "boost")) {
              $boostZip = "boost_1_89_0.zip"
              $boostUrl = "https://archives.boost.io/release/1.89.0/source/boost_1_89_0.zip"
              Write-Host "Downloading Boost source from $boostUrl..."
              Invoke-WebRequest -Uri $boostUrl -OutFile $boostZip
              Write-Host "Extracting Boost source..."
              Expand-Archive $boostZip -DestinationPath .
              Rename-Item -Path "boost_1_89_0" -NewName "boost"
              Remove-Item -Path $boostZip -Force
              Write-Host "=== Boost source setup complete ==="
          } else {
              Write-Host "=== Boost already exists, skipping ==="
          }

      # --- Build Boost
      # Shell is cmd so vcvars activation and b2 share the same process.
      #
      # MSVC version detection problem:
      #   Boost 1.84's b2 maps _MSC_VER to a toolset version string. VS 2026
      #   (MSVC 19.51, _MSC_VER=1951) is beyond what the mapping table knows,
      #   so b2 falls back to "msvc-6.0". This makes output paths like:
      #     bin.v2\libs\foo\build\msvc-6.0\release\address-model-64\...
      #   whose combined length + all .obj args exceeds cmd.exe's 8191-char
      #   limit, causing "filename syntax incorrect" on every msvc.archive call.
      #
      # Fix: write a user-config.jam with an explicit "using msvc : 14.4 ;"
      #   pointing at the resolved cl.exe path. b2 uses the version string we
      #   supply verbatim, bypassing the broken _MSC_VER lookup entirely.
      #   "14.4" maps to MSVC 19.4x (VS 2022+/2026), giving short path tags
      #   like "msvc-14.4" that stay well within the cmd.exe limit.
      - name: Build Boost
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off

          :: Locate vcvars64.bat via vswhere
          set VSWHERE="%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`%VSWHERE% -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          if not defined VS_PATH ( echo ERROR: VS not found via vswhere & exit /b 1 )

          set VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat
          if not exist "%VCVARS%" ( echo ERROR: vcvars64.bat not found at %VCVARS% & exit /b 1 )

          echo === Activating MSVC from: %VCVARS% ===
          call "%VCVARS%"
          if errorlevel 1 ( echo ERROR: vcvars64.bat failed & exit /b 1 )

          :: Resolve cl.exe path — needed for user-config.jam
          for /f "usebackq tokens=*" %%i in (`where cl.exe`) do set CL_PATH=%%i
          if not defined CL_PATH ( echo ERROR: cl.exe not found on PATH after vcvars & exit /b 1 )
          echo === cl.exe: %CL_PATH% ===
          cl 2>&1 | findstr /i "version"

          cd external\boost
          echo === Boost root: %CD% ===

          :: Bootstrap b2 if missing
          if not exist b2.exe (
              echo Bootstrapping Boost...
              call bootstrap.bat msvc
              if errorlevel 1 ( echo ERROR: bootstrap failed & exit /b 1 )
          ) else (
              echo b2.exe already exists, skipping bootstrap
          )

          :: Wipe the entire standalone/msvc sentinel dir so b2 re-probes on
          :: every run regardless of toolset version
          if exist bin.v2\standalone\msvc (
              echo Removing stale b2 MSVC sentinel dir...
              rmdir /s /q bin.v2\standalone\msvc
          )

          :: Write a user-config.jam that pins the toolset version to "14.4".
          :: This bypasses b2's _MSC_VER-to-version mapping, which falls back
          :: to "msvc-6.0" for VS 2026 (MSVC 19.51) because Boost 1.89 was
          :: released before VS 2026 shipped. The "6.0" tag creates paths that
          :: overflow cmd.exe's 8191-char limit on msvc.archive/link.dll calls.
          echo using msvc : 14.4 : "%CL_PATH%" ; > user-config.jam
          echo === user-config.jam written: ===
          type user-config.jam

          echo Building Boost (this may take several minutes)...
          b2.exe install ^
              toolset=msvc-14.4 ^
              variant=release ^
              link=static,shared ^
              threading=multi ^
              runtime-link=shared ^
              address-model=64 ^
              --without-wave ^
              --without-url ^
              --without-stacktrace ^
              --without-test ^
              --user-config=user-config.jam ^
              --prefix="%CD%" ^
              -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 ( echo ERROR: b2 build failed & exit /b 1 )

          if not exist boost\config.hpp ( echo ERROR: Boost headers missing & exit /b 1 )
          dir /b lib\*.lib >nul 2>&1
          if errorlevel 1 ( echo ERROR: Boost libraries missing & exit /b 1 )

          echo === Boost built successfully ===

      - name: Build SDL3
        shell: pwsh
        run: |
          cd external/SDL
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cd build
          cmake .. -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$($PWD.Path)" -DSDL_SHARED=ON -DSDL_STATIC=ON
          cmake --build . --config Release --parallel
          cmake --build . --config Release --target install

      - name: Build NFD
        shell: pwsh
        run: |
          cd external/nativefiledialog-extended
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cd build
          cmake .. -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$($PWD.Path)"
          cmake --build . --config Release --parallel
          cmake --build . --config Release --target install

      - name: Set dependency paths
        shell: pwsh
        run: |
          echo "IMGUI_ROOT=$env:GITHUB_WORKSPACE\external\imgui"                       >> $env:GITHUB_ENV
          echo "MINIZ_ROOT=$env:GITHUB_WORKSPACE\external\miniz"                       >> $env:GITHUB_ENV
          echo "STB_ROOT=$env:GITHUB_WORKSPACE\external\stb"                           >> $env:GITHUB_ENV
          echo "RAPID_JSON_ROOT=$env:GITHUB_WORKSPACE\external\rapidjson"              >> $env:GITHUB_ENV
          echo "BOOST_ROOT=$env:GITHUB_WORKSPACE\external\boost"                       >> $env:GITHUB_ENV
          echo "SDL3_ROOT=$env:GITHUB_WORKSPACE\external\SDL\build"                    >> $env:GITHUB_ENV
          echo "NFD_ROOT=$env:GITHUB_WORKSPACE\external\nativefiledialog-extended"     >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 18 2026" -A x64 ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DGIT_COMMIT_HASH=%GIT_COMMIT_HASH% ^
                -DIMGUI_ROOT=%IMGUI_ROOT% ^
                -DMINIZ_ROOT=%MINIZ_ROOT% ^
                -DSTB_ROOT=%STB_ROOT% ^
                -DRAPID_JSON_ROOT=%RAPID_JSON_ROOT% ^
                -DBOOST_ROOT=%BOOST_ROOT% ^
                -DSDL3_ROOT=%SDL3_ROOT% ^
                -DNFD_ROOT=%NFD_ROOT% ^
                -S . -B build
        shell: cmd

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/bin/

# ─────────────────────────────────────────────────────────────────────────────
# LINUX BUILD  — always runs
# ─────────────────────────────────────────────────────────────────────────────
  build_linux:
    name: Build Linux (Ninja)
    needs: bump_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.source_branch }}
          submodules: recursive

      - name: Export git commit hash
        run: echo "GIT_COMMIT_HASH=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake git \
                                  libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxi-dev libgl1-mesa-dev libglu1-mesa-dev \
                                  libgtk-3-dev libxss-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
                                  libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Cache external dependencies
        id: cache-external
        uses: actions/cache@v4
        with:
          path: |
            external/imgui
            external/miniz
            external/stb
            external/rapidjson
            external/boost
            external/SDL
            external/nativefiledialog-extended
          key: linux-external-all-v3-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            linux-external-all-v3-

      - name: Clone all dependencies
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          mkdir -p external && cd external

          [ ! -d "imgui" ] && git clone https://github.com/ocornut/imgui.git --branch docking --depth 1

          if [ ! -d "miniz" ]; then
            curl -L "https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip" -o miniz.zip
            mkdir -p _miniz_extract && unzip miniz.zip -d _miniz_extract
            mv _miniz_extract miniz && rm -f miniz.zip
          fi

          [ ! -d "stb/stb" ]    && git clone --depth 1 https://github.com/nothings/stb.git stb/stb
          [ ! -d "rapidjson" ]  && git clone --depth 1 https://github.com/Tencent/rapidjson.git rapidjson
          [ ! -d "SDL" ]        && git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL

          if [ ! -d "boost" ]; then
            git clone https://github.com/boostorg/boost.git --branch boost-1.89.0 --depth 1
            cd boost && git submodule update --init --depth 1 && cd ..
          fi

          if [ ! -d "nativefiledialog-extended" ]; then
            git clone https://github.com/btzy/nativefiledialog-extended.git \
              --depth 1 --recurse-submodules --shallow-submodules
          fi

      - name: Build Boost
        run: |
          cd external/boost
          chmod +x bootstrap.sh
          ./bootstrap.sh --prefix="$PWD"
          ./b2 install variant=release link=static,shared threading=multi -j$(nproc)

      - name: Build SDL3
        run: |
          cd external/SDL && mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD -DSDL_SHARED=ON -DSDL_STATIC=ON
          ninja -j$(nproc) && ninja install

      - name: Build NFD
        run: |
          cd external/nativefiledialog-extended && mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD
          ninja -j$(nproc) && ninja install

      - name: Set dependency paths
        run: |
          echo "IMGUI_ROOT=$GITHUB_WORKSPACE/external/imgui"                       >> $GITHUB_ENV
          echo "MINIZ_ROOT=$GITHUB_WORKSPACE/external/miniz"                       >> $GITHUB_ENV
          echo "STB_ROOT=$GITHUB_WORKSPACE/external/stb"                           >> $GITHUB_ENV
          echo "RAPID_JSON_ROOT=$GITHUB_WORKSPACE/external/rapidjson"              >> $GITHUB_ENV
          echo "BOOST_ROOT=$GITHUB_WORKSPACE/external/boost"                       >> $GITHUB_ENV
          echo "SDL3_ROOT=$GITHUB_WORKSPACE/external/SDL/build"                    >> $GITHUB_ENV
          echo "NFD_ROOT=$GITHUB_WORKSPACE/external/nativefiledialog-extended"     >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DGIT_COMMIT_HASH=$GIT_COMMIT_HASH \
                -DIMGUI_ROOT=$IMGUI_ROOT \
                -DMINIZ_ROOT=$MINIZ_ROOT \
                -DSTB_ROOT=$STB_ROOT \
                -DRAPID_JSON_ROOT=$RAPID_JSON_ROOT \
                -DBOOST_ROOT=$BOOST_ROOT \
                -DSDL3_ROOT=$SDL3_ROOT \
                -DNFD_ROOT=$NFD_ROOT \
                -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/bin/

# ─────────────────────────────────────────────────────────────────────────────
# EMSCRIPTEN BUILD  — always runs
# ─────────────────────────────────────────────────────────────────────────────
  build_emscripten:
    name: Build Emscripten (Web)
    needs: bump_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump_version.outputs.source_branch }}
          submodules: recursive

      - name: Export git commit hash
        run: echo "GIT_COMMIT_HASH=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Cache external dependencies
        id: cache-external
        uses: actions/cache@v4
        with:
          path: |
            external/imgui
            external/miniz
            external/stb
            external/SDL
            external/emscripten-browser-file
            external/boost
            external/rapidjson
          key: emscripten-external-all-v4-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            emscripten-external-all-v4-

      - name: Cache SDL3 Emscripten
        id: cache-sdl-emscripten
        uses: actions/cache@v4
        with:
          path: |
            external/SDL-build/emscripten
            external/SDL-install/emscripten
          key: sdl3-emscripten-v3-${{ hashFiles('external/SDL/**') }}
          restore-keys: |
            sdl3-emscripten-v3-

      - name: Clone dependencies
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          mkdir -p external && cd external

          if [ ! -d "boost" ]; then
            git clone https://github.com/boostorg/boost.git --branch boost-1.89.0 --depth 1
            cd boost && git submodule update --init --depth 1 && cd ..
          fi

          [ ! -d "imgui" ] && git clone https://github.com/ocornut/imgui.git --branch docking --depth 1

          if [ ! -d "miniz" ]; then
            curl -L "https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip" -o miniz.zip
            mkdir -p _miniz_extract && unzip miniz.zip -d _miniz_extract
            mv _miniz_extract miniz && rm -f miniz.zip
          fi

          [ ! -d "stb/stb" ]   && git clone --depth 1 https://github.com/nothings/stb.git stb/stb
          [ ! -d "rapidjson" ] && git clone --depth 1 https://github.com/Tencent/rapidjson.git rapidjson
          [ ! -d "SDL" ]       && git clone --depth 1 https://github.com/libsdl-org/SDL.git SDL

          if [ ! -d "emscripten-browser-file" ]; then
            git clone https://github.com/Armchair-Software/emscripten-browser-file.git --depth 1
          fi

      - name: Set dependency paths
        run: |
          echo "IMGUI_ROOT=$GITHUB_WORKSPACE/external/imgui"                       >> $GITHUB_ENV
          echo "MINIZ_ROOT=$GITHUB_WORKSPACE/external/miniz"                       >> $GITHUB_ENV
          echo "STB_ROOT=$GITHUB_WORKSPACE/external/stb"                           >> $GITHUB_ENV
          echo "RAPID_JSON_ROOT=$GITHUB_WORKSPACE/external/rapidjson"              >> $GITHUB_ENV
          echo "EFB_ROOT=$GITHUB_WORKSPACE/external/emscripten-browser-file"       >> $GITHUB_ENV
          echo "BOOST_ROOT=$GITHUB_WORKSPACE/external/boost"                       >> $GITHUB_ENV
          echo "SDL3_ROOT=$GITHUB_WORKSPACE/external/SDL-install/emscripten"       >> $GITHUB_ENV

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: '3.1.66'
          actions-cache-folder: 'emsdk-cache'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Boost
        run: |
          cd external/boost
          chmod +x bootstrap.sh
          ./bootstrap.sh --prefix="$PWD"
          ./b2 install variant=release link=static,shared threading=multi -j$(nproc)

      - name: Build SDL3 (Emscripten)
        run: |
          if [ -f external/SDL-install/emscripten/build/lib/libSDL3.a ]; then
            echo "SDL3 Emscripten already built, skipping"; exit 0
          fi
          mkdir -p external/SDL-build/emscripten external/SDL-install/emscripten/build
          cd external/SDL-build/emscripten
          emcmake cmake ../../SDL -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/external/SDL-install/emscripten/build \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF
          ninja -j$(nproc) && ninja install

      - name: Configure CMake
        run: |
          emcmake cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGIT_COMMIT_HASH=$GIT_COMMIT_HASH \
            -DSDL3_ROOT=$SDL3_ROOT \
            -DIMGUI_ROOT=$IMGUI_ROOT \
            -DMINIZ_ROOT=$MINIZ_ROOT \
            -DSTB_ROOT=$STB_ROOT \
            -DRAPID_JSON_ROOT=$RAPID_JSON_ROOT \
            -DEFB_ROOT=$EFB_ROOT \
            -DBOOST_ROOT=$BOOST_ROOT \
            -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Prepare web artifacts
        run: |
          mkdir -p pages
          cp build/bin/masquerade.data  pages/
          cp build/bin/masquerade.html  pages/
          cp build/bin/masquerade.js    pages/
          cp build/bin/masquerade.wasm  pages/

      - name: Upload Emscripten artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-build
          path: pages/

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE  —  only runs when ALL THREE builds pass
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release PR in Masquerade-Emulator
    needs: [build_windows, build_linux, build_emscripten]
    runs-on: ubuntu-latest
    env:
      VERSION:       ${{ github.event.inputs.version }}
      EMULATOR_REPO: Kotambail-Hegde/Masquerade-Emulator
      BRANCH:        release/${{ github.event.inputs.version }}

    steps:
      # ── Download all artifacts ────────────────────────────────────────────
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: artifacts/assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux

      - name: Download Emscripten artifacts
        uses: actions/download-artifact@v4
        with:
          name: emscripten-build
          path: artifacts/emscripten

      - name: Verify all artifacts downloaded
        run: |
          echo "=== Artifact download verification ==="
          for dir in artifacts/assets artifacts/windows artifacts/linux artifacts/emscripten; do
            if [ -d "$dir" ] && [ "$(ls -A $dir)" ]; then
              echo "✅ $dir — $(ls $dir | wc -l) files"
            else
              echo "❌ $dir — MISSING or EMPTY"
              exit 1
            fi
          done

      # ── Checkout Masquerade-Emulator into a subdirectory ─────────────────
      # IMPORTANT: path: emulator-repo keeps artifacts/ untouched
      - name: Checkout Masquerade-Emulator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EMULATOR_REPO }}
          token: ${{ secrets.EMULATOR_REPO_PAT }}
          fetch-depth: 0
          submodules: recursive
          path: emulator-repo

      - name: Clean up any existing release branch and tags
        working-directory: emulator-repo
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          # Delete existing Emulator release branch if it exists (from a previous failed/rejected run)
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ env.EMULATOR_REPO }}/git/refs/heads/$BRANCH
            echo "✅ Deleted existing Emulator branch $BRANCH"
          else
            echo "ℹ️  No existing Emulator branch $BRANCH"
          fi

          # Delete existing Emulator tag if it exists
          if gh api -H "Accept: application/vnd.github+json" \
              /repos/${{ env.EMULATOR_REPO }}/git/ref/tags/$VERSION > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ env.EMULATOR_REPO }}/git/refs/tags/$VERSION
            echo "✅ Deleted existing Emulator tag $VERSION"
          else
            echo "ℹ️  No existing Emulator tag $VERSION"
          fi

          # Delete existing Source tag if it exists
          if gh api -H "Accept: application/vnd.github+json" \
              /repos/Kotambail-Hegde/Masquerade-Source/git/ref/tags/$VERSION > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/Kotambail-Hegde/Masquerade-Source/git/refs/tags/$VERSION
            echo "✅ Deleted existing Source tag $VERSION"
          else
            echo "ℹ️  No existing Source tag $VERSION"
          fi

      - name: Create release branch
        working-directory: emulator-repo
        run: git checkout -b "$BRANCH"

      - name: Install rsync
        run: sudo apt-get install -y rsync

      # ── Place artifacts ───────────────────────────────────────────────────
      # For each platform:
      #   1. Copy the build artifact (may contain bundled assets with bios)
      #   2. Strip ALL bundled assets from the build artifact output
      #   3. Re-populate assets from the separately-uploaded clean artifact
      #      using rsync with legal exclusions
      #
      # Legal exclusions applied via rsync:
      #   - gb/gbc/gba bios *.bin  — legal reasons
      #   - saves/                 — user data
      #   - spaceInvaders/audio/   — legal reasons
      #   - c8/db/chip-8-database/ — submodule (pointer kept by git, contents not copied)
      - name: Place artifacts
        working-directory: emulator-repo
        run: |

          # ── Helper: overlay clean assets without wiping (preserves placeholders) ──
          place_assets() {
            local DEST="$1"
            mkdir -p "$DEST"
            # Overlay only — no rm -rf so placeholder files are preserved
            rsync -a \
              --exclude='gb/bios/*.bin' \
              --exclude='gbc/bios/*.bin' \
              --exclude='gba/bios/*.bin' \
              --exclude='saves/' \
              --exclude='spaceInvaders/audio/' \
              --exclude='c8/db/chip-8-database/' \
              --exclude='internal/cheats.txt' \
              ../artifacts/assets/. "$DEST/"
            echo "✅ Clean assets overlaid into $DEST"
          }

          # ── Hosting — only replace masquerade files, keep index.html etc. ──
          cp ../artifacts/emscripten/masquerade.data  hosting/
          cp ../artifacts/emscripten/masquerade.html  hosting/
          cp ../artifacts/emscripten/masquerade.js    hosting/
          cp ../artifacts/emscripten/masquerade.wasm  hosting/
          echo "✅ Hosting placed"

          # ── LICENSE.md → Emulator repo root ──────────────────────────────
          if [ -f "../artifacts/windows/Release/LICENSE.md" ]; then
            cp ../artifacts/windows/Release/LICENSE.md ./LICENSE.md
            echo "✅ LICENSE.md placed at repo root"
          fi

          # ── Windows ───────────────────────────────────────────────────────
          if [ "${{ github.event.inputs.release_windows }}" = "true" ]; then
            # Copy from Release/ subfolder, excluding pgc/pgd/LICENSE files
            rsync -a \
              --exclude='*.pgc' \
              --exclude='*.pgd' \
              --exclude='LICENSE.md' \
              --exclude='assets/' \
              ../artifacts/windows/Release/. windows/
            # Overlay clean assets (no wipe)
            WIN_ASSETS=$(find ../artifacts/windows/Release -type d -name "assets" | head -1)
            if [ -n "$WIN_ASSETS" ]; then
              place_assets windows/assets
            fi
            echo "✅ Windows artifacts placed"
          else
            echo "⏭️  Windows not selected for this release"
          fi

          # ── Linux ─────────────────────────────────────────────────────────
          if [ "${{ github.event.inputs.release_linux }}" = "true" ]; then
            rsync -a \
              --exclude='assets/' \
              ../artifacts/linux/. linux/
            place_assets linux/assets
            echo "✅ Linux artifacts placed"
          else
            echo "⏭️  Linux not selected for this release"
          fi

          # ── Emscripten — only replace masquerade files ────────────────────
          if [ "${{ github.event.inputs.release_emscripten }}" = "true" ]; then
            cp ../artifacts/emscripten/masquerade.data  emscripten/
            cp ../artifacts/emscripten/masquerade.html  emscripten/
            cp ../artifacts/emscripten/masquerade.js    emscripten/
            cp ../artifacts/emscripten/masquerade.wasm  emscripten/
            echo "✅ Emscripten artifacts placed"
          else
            echo "⏭️  Emscripten not selected for this release"
          fi

          # macOS — not yet supported
          echo "⏭️  macOS not yet supported"

      # ── Commit and push ───────────────────────────────────────────────────
      - name: Commit and push
        working-directory: emulator-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosting/ LICENSE.md
          [ "${{ github.event.inputs.release_windows }}" = "true" ]    && git add windows/
          [ "${{ github.event.inputs.release_linux }}" = "true" ]      && git add linux/
          [ "${{ github.event.inputs.release_emscripten }}" = "true" ] && git add emscripten/
          git commit -m "release: $VERSION

          Platforms included: windows=${{ github.event.inputs.release_windows }} linux=${{ github.event.inputs.release_linux }} emscripten=${{ github.event.inputs.release_emscripten }}
          hosting/ always updated. Assets placed inside platform folders (legal exclusions applied).
          All 3 platforms built and passed. Source @ ${{ github.sha }} — triggered by: ${{ github.actor }}"
          git push origin "$BRANCH"

      # ── Create tags on both repos ─────────────────────────────────────────
      - name: Create tag on Masquerade-Emulator
        working-directory: emulator-repo
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "✅ Tag $VERSION created on Masquerade-Emulator"

      - name: Create tag on Masquerade-Source
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Kotambail-Hegde/Masquerade-Source/git/refs \
            -f ref="refs/tags/$VERSION" \
            -f sha="$(gh api /repos/Kotambail-Hegde/Masquerade-Source/git/ref/heads/release/$VERSION --jq '.object.sha')"
          echo "✅ Tag $VERSION created on Masquerade-Source"

      # ── Set PENDING status — blocks Emulator PR merge until submodule updated
      - name: Set pending status on Emulator PR
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          EMULATOR_BRANCH_SHA=$(cd emulator-repo && git rev-parse HEAD)
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.EMULATOR_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ env.EMULATOR_REPO }}/statuses/$EMULATOR_BRANCH_SHA \
            -d '{
              "state": "pending",
              "context": "submodule-update",
              "description": "Waiting for submodule to be updated after Source PR merges"
            }'

      # ── Open PR #2 in Masquerade-Emulator ────────────────────────────────
      - name: Open PR #2 in Masquerade-Emulator
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          TABLE=""
          [ "${{ github.event.inputs.release_windows }}" = "true" ]    && TABLE="$TABLE\n| \`/windows\` | Windows (MSVC x64) binaries + assets |"
          [ "${{ github.event.inputs.release_linux }}" = "true" ]      && TABLE="$TABLE\n| \`/linux\` | Linux (Ninja) binaries + assets |"
          [ "${{ github.event.inputs.release_emscripten }}" = "true" ] && TABLE="$TABLE\n| \`/emscripten\` | WebAssembly build artifacts |"

          gh pr create \
            --repo "$EMULATOR_REPO" \
            --title "Release $VERSION" \
            --body "## Release $VERSION

          All three platform builds passed. ✅

          | Folder | Contents |
          |--------|----------|
          | \`/hosting\` | Web hosting files — GitHub Pages (always updated) |
          $(echo -e "$TABLE")

          > ℹ️ Platform folders not listed above were intentionally excluded from
          > this release but their binaries were still built and verified.
          > Assets include legal exclusions (bios, saves, audio, chip-8-database).

          ### Source
          - **Branch:** \`release/$VERSION\` in Masquerade-Source
          - **Commit:** \`${{ github.sha }}\`
          - **Triggered by:** @${{ github.actor }}

          ### ⚠️ Merge order
          1. Masquerade-Source PR \`release/$VERSION\` will be auto-merged next
          2. \`update-submodule.yml\` will auto-run, update \`src/\` submodule here, and unblock this PR
          3. Merge this PR

          ### Status checks
          - \`submodule-update\` — 🟡 Pending (waiting for submodule update)" \
            --base main \
            --head "$BRANCH"

      # ── Auto-merge Source PR ──────────────────────────────────────────────
      - name: Auto-merge Source PR
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "Kotambail-Hegde/Masquerade-Source" \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number')

          echo "Auto-merging Source PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" \
            --repo "Kotambail-Hegde/Masquerade-Source" \
            --merge \
            --subject "Release $VERSION: bump VERSION macro" \
            --body "Auto-merged by release workflow after all builds passed and Emulator PR was created."
          echo "✅ Source PR #$PR_NUMBER merged"

      - name: Delete Source release branch after merge
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            /repos/Kotambail-Hegde/Masquerade-Source/git/refs/heads/$BRANCH
          echo "✅ Source branch $BRANCH deleted"

      - name: Trigger update-submodule workflow
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          gh workflow run update-submodule.yml \
            --repo "Kotambail-Hegde/Masquerade-Source" \
            --field version=$VERSION \
            --field triggered_by_release=true
          echo "✅ update-submodule.yml triggered for $VERSION"

# ─────────────────────────────────────────────────────────────────────────────
# CLEANUP  —  runs only if any job failed or was cancelled
# Closes the Source bump-version PR and deletes the release branch so there
# is no leftover noise from a failed release attempt.
# ─────────────────────────────────────────────────────────────────────────────
  cleanup_on_failure:
    name: Cleanup Source PR and branch on failure
    needs: [bump_version, build_windows, build_linux, build_emscripten, release]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    env:
      BRANCH: release/${{ github.event.inputs.version }}

    steps:
      - name: Close Source PR
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "Kotambail-Hegde/Masquerade-Source" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr close "$PR_NUMBER" \
              --repo "Kotambail-Hegde/Masquerade-Source" \
              --comment "❌ Auto-closed: release workflow failed or was cancelled. Branch \`$BRANCH\` will also be deleted."
            echo "✅ Source PR #$PR_NUMBER closed"
          else
            echo "ℹ️  No open Source PR found for $BRANCH — nothing to close"
          fi

      - name: Delete Source release branch
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          if gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/Kotambail-Hegde/Masquerade-Source/git/ref/heads/$BRANCH \
            > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/Kotambail-Hegde/Masquerade-Source/git/refs/heads/$BRANCH
            echo "✅ Branch $BRANCH deleted from Masquerade-Source"
          else
            echo "ℹ️  Branch $BRANCH not found — nothing to delete"
          fi
