name: Build Masquerade

on:
  # Manual trigger for any branch
  workflow_dispatch:

  # Automatically on PRs — but NOT release/* branches
  # (those are auto-created by release.yml and don't need a separate build)
  pull_request:
    branches-ignore:
      - 'release/**'

  # Scheduled run every Friday at 5 PM IST (11:30 AM UTC)
  schedule:
    - cron: '30 11 * * 5'

  # On pushes to master affecting relevant files
  push:
    branches:
      - master
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.a'
      - '**/*.lib'
      - '**/*.dll'
      - '**/CMakeLists.txt'
      - '**/*.html'
      - '**/*.exe'
      - '**/*.cpp'
      - '.github/workflows/build.yml'
      - '**/*.hpp'
      - '**/*.bin'
      - '**/*.cxx'
      - '**/*.hxx'
      - '**/*.py'
      - '**/*.cmake'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    # Skip version bump commits (auto-merged by release.yml) and revert commits
    # so the release flow doesn't trigger redundant builds on master
    if: |
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'chore: bump VERSION') &&
       !startsWith(github.event.head_commit.message, 'Revert'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export git commit hash
        run: echo "GIT_COMMIT_HASH=$env:GITHUB_SHA" >> $env:GITHUB_ENV
        shell: pwsh

      # --- Cache all external dependencies
      # v15: b2 auto-detects MSVC version via _MSC_VER mapping, but VS 2026
      # (MSVC 19.51) isn't in Boost 1.84's mapping table so b2 falls back to
      # the bogus "msvc-6.0" tag. This produces paths like:
      #   bin.v2\libs\foo\build\msvc-6.0\release\address-model-64\link-static\...
      # which overflow cmd.exe's 8191-char limit on msvc.archive/msvc.link.dll,
      # causing "filename syntax incorrect" on every lib. Fix: write a
      # user-config.jam that explicitly sets "using msvc : 14.4 ;" with the
      # resolved cl.exe path, bypassing the broken auto-detection entirely.
      - name: Cache external dependencies
        id: cache-external
        uses: actions/cache@v4
        with:
          path: |
            external/imgui
            external/miniz
            external/stb
            external/rapidjson
            external/boost
            external/SDL
            external/nativefiledialog-extended
          key: windows-external-all-v15-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            windows-external-all-v15-

      # --- Clone all dependencies (only if not cached)
      - name: Clone all dependencies
        if: steps.cache-external.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $externalDir = "external"
          if (-not (Test-Path $externalDir)) { New-Item -ItemType Directory -Path $externalDir | Out-Null }

          cd external

          if (-not (Test-Path "imgui")) {
              git clone https://github.com/ocornut/imgui.git --branch docking --depth 1
          }

          if (-not (Test-Path "miniz")) {
              Write-Host "=== MINIZ: not found, downloading ==="
              $url = "https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip"
              $zip = "miniz-3.0.2.zip"
              $tmpDir = "_miniz_extract"
              Invoke-WebRequest -Uri $url -OutFile $zip
              if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
              Expand-Archive $zip -DestinationPath $tmpDir -Force
              if (Test-Path "miniz") { Remove-Item -Recurse -Force "miniz" }
              Move-Item -Path $tmpDir -Destination "miniz"
              Remove-Item -Path $zip -Force
              Write-Host "=== MINIZ setup complete ==="
          } else {
              Write-Host "=== MINIZ already exists, skipping ==="
          }

          if (-not (Test-Path "stb/stb")) {
              git clone https://github.com/nothings/stb.git --depth 1 stb/stb
          }

          if (-not (Test-Path "rapidjson")) {
              git clone https://github.com/Tencent/rapidjson.git --depth 1 rapidjson
          }

          if (-not (Test-Path "SDL")) {
              git clone https://github.com/libsdl-org/SDL.git --depth 1 SDL
          }

          if (-not (Test-Path "nativefiledialog-extended")) {
              git clone https://github.com/btzy/nativefiledialog-extended.git --depth 1 --recurse-submodules --shallow-submodules
          }

          if (-not (Test-Path "boost")) {
              $boostZip = "boost_1_84_0.zip"
              $boostUrl = "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip"
              Write-Host "Downloading Boost source from $boostUrl..."
              Invoke-WebRequest -Uri $boostUrl -OutFile $boostZip
              Write-Host "Extracting Boost source..."
              Expand-Archive $boostZip -DestinationPath .
              Rename-Item -Path "boost_1_84_0" -NewName "boost"
              Remove-Item -Path $boostZip -Force
              Write-Host "=== Boost source setup complete ==="
          } else {
              Write-Host "=== Boost already exists, skipping ==="
          }

      # --- Build Boost
      # Shell is cmd so vcvars activation and b2 share the same process.
      #
      # MSVC version detection problem:
      #   Boost 1.84's b2 maps _MSC_VER to a toolset version string. VS 2026
      #   (MSVC 19.51, _MSC_VER=1951) is beyond what the mapping table knows,
      #   so b2 falls back to "msvc-6.0". This makes output paths like:
      #     bin.v2\libs\foo\build\msvc-6.0\release\address-model-64\...
      #   whose combined length + all .obj args exceeds cmd.exe's 8191-char
      #   limit, causing "filename syntax incorrect" on every msvc.archive call.
      #
      # Fix: write a user-config.jam with an explicit "using msvc : 14.4 ;"
      #   pointing at the resolved cl.exe path. b2 uses the version string we
      #   supply verbatim, bypassing the broken _MSC_VER lookup entirely.
      #   "14.4" maps to MSVC 19.4x (VS 2022+/2026), giving short path tags
      #   like "msvc-14.4" that stay well within the cmd.exe limit.
      - name: Build Boost
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off

          :: Locate vcvars64.bat via vswhere
          set VSWHERE="%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`%VSWHERE% -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          if not defined VS_PATH ( echo ERROR: VS not found via vswhere & exit /b 1 )

          set VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat
          if not exist "%VCVARS%" ( echo ERROR: vcvars64.bat not found at %VCVARS% & exit /b 1 )

          echo === Activating MSVC from: %VCVARS% ===
          call "%VCVARS%"
          if errorlevel 1 ( echo ERROR: vcvars64.bat failed & exit /b 1 )

          :: Resolve cl.exe path — needed for user-config.jam
          for /f "usebackq tokens=*" %%i in (`where cl.exe`) do set CL_PATH=%%i
          if not defined CL_PATH ( echo ERROR: cl.exe not found on PATH after vcvars & exit /b 1 )
          echo === cl.exe: %CL_PATH% ===
          cl 2>&1 | findstr /i "version"

          cd external\boost
          echo === Boost root: %CD% ===

          :: Bootstrap b2 if missing
          if not exist b2.exe (
              echo Bootstrapping Boost...
              call bootstrap.bat msvc
              if errorlevel 1 ( echo ERROR: bootstrap failed & exit /b 1 )
          ) else (
              echo b2.exe already exists, skipping bootstrap
          )

          :: Wipe the entire standalone/msvc sentinel dir so b2 re-probes on
          :: every run regardless of toolset version
          if exist bin.v2\standalone\msvc (
              echo Removing stale b2 MSVC sentinel dir...
              rmdir /s /q bin.v2\standalone\msvc
          )

          :: Write a user-config.jam that pins the toolset version to "14.4".
          :: This bypasses b2's _MSC_VER-to-version mapping, which falls back
          :: to "msvc-6.0" for VS 2026 (MSVC 19.51) because Boost 1.84 was
          :: released before VS 2026 shipped. The "6.0" tag creates paths that
          :: overflow cmd.exe's 8191-char limit on msvc.archive/link.dll calls.
          echo using msvc : 14.4 : "%CL_PATH%" ; > user-config.jam
          echo === user-config.jam written: ===
          type user-config.jam

          echo Building Boost (this may take several minutes)...
          b2.exe install ^
              toolset=msvc-14.4 ^
              variant=release ^
              link=static,shared ^
              threading=multi ^
              runtime-link=shared ^
              address-model=64 ^
              --without-wave ^
              --without-url ^
              --without-stacktrace ^
              --without-test ^
              --user-config=user-config.jam ^
              --prefix="%CD%" ^
              -j%NUMBER_OF_PROCESSORS%
          if errorlevel 1 ( echo ERROR: b2 build failed & exit /b 1 )

          if not exist boost\config.hpp ( echo ERROR: Boost headers missing & exit /b 1 )
          dir /b lib\*.lib >nul 2>&1
          if errorlevel 1 ( echo ERROR: Boost libraries missing & exit /b 1 )

          echo === Boost built successfully ===

      # --- Build SDL3
      - name: Build SDL3
        shell: pwsh
        run: |
          cd external/SDL
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cd build
          cmake .. -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$($PWD.Path)" -DSDL_SHARED=ON -DSDL_STATIC=ON
          cmake --build . --config Release --parallel
          cmake --build . --config Release --target install

      # --- Build NFD
      - name: Build NFD
        shell: pwsh
        run: |
          cd external/nativefiledialog-extended
          if (-not (Test-Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }
          cd build
          cmake .. -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$($PWD.Path)"
          cmake --build . --config Release --parallel
          cmake --build . --config Release --target install

      # --- Set environment variables
      - name: Set dependency paths
        shell: pwsh
        run: |
          echo "IMGUI_ROOT=$env:GITHUB_WORKSPACE\external\imgui" >> $env:GITHUB_ENV
          echo "MINIZ_ROOT=$env:GITHUB_WORKSPACE\external\miniz" >> $env:GITHUB_ENV
          echo "STB_ROOT=$env:GITHUB_WORKSPACE\external\stb" >> $env:GITHUB_ENV
          echo "RAPID_JSON_ROOT=$env:GITHUB_WORKSPACE\external\rapidjson" >> $env:GITHUB_ENV
          echo "BOOST_ROOT=$env:GITHUB_WORKSPACE\external\boost" >> $env:GITHUB_ENV
          echo "SDL3_ROOT=$env:GITHUB_WORKSPACE\external\SDL\build" >> $env:GITHUB_ENV
          echo "NFD_ROOT=$env:GITHUB_WORKSPACE\external\nativefiledialog-extended" >> $env:GITHUB_ENV

      # --- Configure CMake
      - name: Configure CMake
        run: |
          cmake -G "Visual Studio 18 2026" -A x64 ^
                -DCMAKE_BUILD_TYPE=Release ^
                -DGIT_COMMIT_HASH=%GIT_COMMIT_HASH% ^
                -DIMGUI_ROOT=%IMGUI_ROOT% ^
                -DMINIZ_ROOT=%MINIZ_ROOT% ^
                -DSTB_ROOT=%STB_ROOT% ^
                -DRAPID_JSON_ROOT=%RAPID_JSON_ROOT% ^
                -DBOOST_ROOT=%BOOST_ROOT% ^
                -DSDL3_ROOT=%SDL3_ROOT% ^
                -DNFD_ROOT=%NFD_ROOT% ^
                -S . -B build
        shell: cmd

      # --- Build
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # --- Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/bin/

  build_linux:
    name: Build Linux (Ninja)
    runs-on: ubuntu-latest
    # Skip version bump commits (auto-merged by release.yml) and revert commits
    if: |
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'chore: bump VERSION') &&
       !startsWith(github.event.head_commit.message, 'Revert'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export git commit hash
        run: echo "GIT_COMMIT_HASH=${GITHUB_SHA}" >> $GITHUB_ENV

      # --- Install system dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake git \
                                  libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
                                  libxi-dev libgl1-mesa-dev libglu1-mesa-dev \
                                  libgtk-3-dev libxss-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
                                  libwayland-dev wayland-protocols libxkbcommon-dev

      # --- Cache external dependencies
      - name: Cache external dependencies
        id: cache-external
        uses: actions/cache@v4
        with:
          path: |
            external/imgui
            external/miniz
            external/stb
            external/rapidjson
            external/boost
            external/SDL
            external/nativefiledialog-extended
          key: linux-external-all-v2-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            linux-external-all-v2-

      # --- Clone all dependencies
      - name: Clone all dependencies
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          cd external

          if [ ! -d "imgui" ]; then
            git clone https://github.com/ocornut/imgui.git --branch docking --depth 1
          fi

          # --- Miniz
          if [ ! -d "miniz" ]; then
            echo "=== MINIZ not found, downloading release 3.0.2 ==="
            URL="https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip"
            ZIP="miniz-3.0.2.zip"
            TMPDIR="_miniz_extract"
            
            echo "Downloading $URL"
            curl -L "$URL" -o "$ZIP"
            
            echo "Extracting $ZIP into $TMPDIR/"
            mkdir -p "$TMPDIR"
            unzip "$ZIP" -d "$TMPDIR"
            
            echo "Moving $TMPDIR -> miniz"
            mv "$TMPDIR" miniz
            
            echo "Cleaning up"
            rm -f "$ZIP"
            
            echo "=== MINIZ ready at $(pwd)/miniz ==="
          else
            echo "=== MINIZ already exists, skipping ==="
          fi

          if [ ! -d "stb/stb" ]; then
            git clone --depth 1 https://github.com/nothings/stb.git stb/stb
          fi

          if [ ! -d "rapidjson" ]; then
            git clone --depth 1 https://github.com/Tencent/rapidjson.git rapidjson
          fi

          if [ ! -d "boost" ]; then
            git clone https://github.com/boostorg/boost.git --branch boost-1.84.0 --depth 1
            cd boost
            git submodule update --init --depth 1
            cd ..
          fi

          if [ ! -d "SDL" ]; then
            git clone https://github.com/libsdl-org/SDL.git --depth 1 SDL
          fi

          # --- NativeFileDialog-Extended
          if [ ! -d "nativefiledialog-extended" ]; then
            git clone https://github.com/btzy/nativefiledialog-extended.git \
              --depth 1 --recurse-submodules --shallow-submodules
          fi

      # --- Build Boost
      - name: Build Boost
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd external/boost

          # Ensure script is executable
          chmod +x bootstrap.sh

          # Bootstrap Boost
          ./bootstrap.sh --prefix="$PWD"

          # Build + install (static + shared)
          ./b2 install \
            variant=release \
            link=static,shared \
            threading=multi \
            -j$(nproc)

      # --- Build SDL3
      - name: Build SDL3
        run: |
          cd external/SDL
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD -DSDL_SHARED=ON -DSDL_STATIC=ON
          ninja -j$(nproc)
          ninja install

      # --- Build NFD
      - name: Build NFD
        run: |
          cd external/nativefiledialog-extended
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD
          ninja -j$(nproc)
          ninja install

      # --- Set environment variables
      - name: Set dependency paths
        run: |
          echo "IMGUI_ROOT=$GITHUB_WORKSPACE/external/imgui" >> $GITHUB_ENV
          echo "MINIZ_ROOT=$GITHUB_WORKSPACE/external/miniz" >> $GITHUB_ENV
          echo "STB_ROOT=$GITHUB_WORKSPACE/external/stb" >> $GITHUB_ENV
          echo "RAPID_JSON_ROOT=$GITHUB_WORKSPACE/external/rapidjson" >> $GITHUB_ENV
          echo "BOOST_ROOT=$GITHUB_WORKSPACE/external/boost" >> $GITHUB_ENV
          echo "SDL3_ROOT=$GITHUB_WORKSPACE/external/SDL/build" >> $GITHUB_ENV
          echo "NFD_ROOT=$GITHUB_WORKSPACE/external/nativefiledialog-extended" >> $GITHUB_ENV

      # --- Configure CMake
      - name: Configure CMake
        run: |
          cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DGIT_COMMIT_HASH=$GIT_COMMIT_HASH \
                -DIMGUI_ROOT=$IMGUI_ROOT \
                -DMINIZ_ROOT=$MINIZ_ROOT \
                -DSTB_ROOT=$STB_ROOT \
                -DRAPID_JSON_ROOT=$RAPID_JSON_ROOT \
                -DBOOST_ROOT=$BOOST_ROOT \
                -DSDL3_ROOT=$SDL3_ROOT \
                -DNFD_ROOT=$NFD_ROOT \
                -S . -B build

      # --- Build
      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)

      # --- Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/bin/

  build_emscripten:
    name: Build Emscripten (Web)
    runs-on: ubuntu-latest
    # Skip version bump commits (auto-merged by release.yml) and revert commits
    if: |
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'chore: bump VERSION') &&
       !startsWith(github.event.head_commit.message, 'Revert'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export git commit hash
        run: echo "GIT_COMMIT_HASH=${GITHUB_SHA}" >> $GITHUB_ENV

      # --- Cache external dependencies
      - name: Cache external dependencies
        id: cache-external
        uses: actions/cache@v4
        with:
          path: |
            external/imgui
            external/miniz
            external/stb
            external/SDL
            external/emscripten-browser-file
            external/boost
            external/rapidjson
          key: emscripten-external-all-v3-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            emscripten-external-all-v3-

      # --- Cache SDL3 (Emscripten build + install)
      - name: Cache SDL3 Emscripten
        id: cache-sdl-emscripten
        uses: actions/cache@v4
        with:
          path: |
            external/SDL-build/emscripten
            external/SDL-install/emscripten
          key: sdl3-emscripten-v3-${{ hashFiles('external/SDL/**') }}
          restore-keys: |
            sdl3-emscripten-v3-

      # --- Clone dependencies
      - name: Clone dependencies
        if: steps.cache-external.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          cd external

          if [ ! -d "boost" ]; then
            git clone https://github.com/boostorg/boost.git --branch boost-1.84.0 --depth 1
            cd boost
            git submodule update --init --depth 1
            cd ..
          fi

          if [ ! -d "imgui" ]; then
            git clone https://github.com/ocornut/imgui.git --branch docking --depth 1
          fi

          # --- Miniz
          if [ ! -d "miniz" ]; then
            echo "=== MINIZ not found, downloading release 3.0.2 ==="
            
            URL="https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip"
            ZIP="miniz-3.0.2.zip"
            TMPDIR="_miniz_extract"
            
            echo "Downloading $URL"
            curl -L "$URL" -o "$ZIP"
            
            echo "Extracting $ZIP into $TMPDIR/"
            mkdir -p "$TMPDIR"
            unzip "$ZIP" -d "$TMPDIR"
            
            echo "Moving $TMPDIR -> miniz"
            mv "$TMPDIR" miniz
            
            echo "Cleaning up"
            rm -f "$ZIP"
            
            echo "=== MINIZ ready at $(pwd)/miniz ==="
          else
            echo "=== MINIZ already exists, skipping ==="
          fi

          if [ ! -d "stb/stb" ]; then
            git clone --depth 1 https://github.com/nothings/stb.git stb/stb
          fi

          if [ ! -d "rapidjson" ]; then
            git clone --depth 1 https://github.com/Tencent/rapidjson.git rapidjson
          fi

          if [ ! -d "SDL" ]; then
            git clone https://github.com/libsdl-org/SDL.git --depth 1 SDL
          fi

          if [ ! -d "emscripten-browser-file" ]; then
            git clone https://github.com/Armchair-Software/emscripten-browser-file.git --depth 1
          fi

      # --- Set environment variables
      - name: Set dependency paths
        run: |
          echo "IMGUI_ROOT=$GITHUB_WORKSPACE/external/imgui" >> $GITHUB_ENV
          echo "MINIZ_ROOT=$GITHUB_WORKSPACE/external/miniz" >> $GITHUB_ENV
          echo "STB_ROOT=$GITHUB_WORKSPACE/external/stb" >> $GITHUB_ENV
          echo "RAPID_JSON_ROOT=$GITHUB_WORKSPACE/external/rapidjson" >> $GITHUB_ENV
          echo "EFB_ROOT=$GITHUB_WORKSPACE/external/emscripten-browser-file" >> $GITHUB_ENV
          echo "BOOST_ROOT=$GITHUB_WORKSPACE/external/boost" >> $GITHUB_ENV
          echo "SDL3_ROOT=$GITHUB_WORKSPACE/external/SDL-install/emscripten" >> $GITHUB_ENV

      # --- Setup Emscripten SDK
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: '3.1.66'
          actions-cache-folder: 'emsdk-cache'

      # --- Install ninja
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # --- Build Boost (Emscripten)
      - name: Build Boost
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd external/boost
          chmod +x bootstrap.sh
          ./bootstrap.sh --prefix="$PWD"
          ./b2 install variant=release link=static,shared threading=multi -j$(nproc)

      # --- Build SDL3 (Emscripten)
      - name: Build SDL3 (Emscripten)
        run: |
          if [ -f external/SDL-install/emscripten/build/lib/libSDL3.a ]; then
            echo "=== SDL3 Emscripten already built, skipping ==="
            exit 0
          fi

          mkdir -p external/SDL-build/emscripten
          mkdir -p external/SDL-install/emscripten/build

          cd external/SDL-build/emscripten

          emcmake cmake ../../SDL -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/external/SDL-install/emscripten/build \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF

          ninja -j$(nproc)
          ninja install

      # --- Configure CMake
      - name: Configure CMake
        run: |
          emcmake cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGIT_COMMIT_HASH=$GIT_COMMIT_HASH \
            -DSDL3_ROOT=$SDL3_ROOT \
            -DIMGUI_ROOT=$IMGUI_ROOT \
            -DMINIZ_ROOT=$MINIZ_ROOT \
            -DSTB_ROOT=$STB_ROOT \
            -DRAPID_JSON_ROOT=$RAPID_JSON_ROOT \
            -DEFB_ROOT=$EFB_ROOT \
            -DBOOST_ROOT=$BOOST_ROOT \
            -S . -B build

      # --- Build
      - name: Build
        run: cmake --build build --config Release --parallel $(nproc)

      # --- Prepare Pages
      - name: Prepare Pages Deployment
        run: |
          mkdir -p pages
          cp build/bin/masquerade.data pages/
          cp build/bin/masquerade.html pages/
          cp build/bin/masquerade.js pages/
          cp build/bin/masquerade.wasm pages/
          echo "Files to deploy:"
          ls -lh pages/

      # --- Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emscripten-build
          path: pages/

      # --- Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/ci_cd_support_1' || github.ref == 'refs/heads/main')
        uses: peaceiris/actions-gh-pages@v3
        with:
