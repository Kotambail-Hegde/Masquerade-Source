name: Update Submodule in Masquerade-Emulator

on:
  # Triggered explicitly by release.yml after Source PR is auto-merged,
  # or manually for standalone submodule updates.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update submodule for (e.g. 0.7009). Leave empty to auto-detect from helpers.h'
        required: false
        type: string
      triggered_by_release:
        description: 'Set to true when triggered by release.yml (uses release branch, sets status)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  statuses: write

jobs:
  update_submodule:
    name: Update src/ submodule in Masquerade-Emulator
    runs-on: ubuntu-latest
    env:
      EMULATOR_REPO: Kotambail-Hegde/Masquerade-Emulator

    steps:
      # ── Checkout Source to read version and get master HEAD SHA ───────────
      - name: Checkout Masquerade-Source master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.EMULATOR_REPO_PAT }}
          fetch-depth: 0

      - name: Resolve version

        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manually provided version: $VERSION"
          else
            VERSION=$(sed -n 's/.*#define VERSION[[:space:]]*static_cast<float>(\([0-9.]*\)).*/\1/p' helpers/helpers.h)
            echo "Auto-detected version from helpers.h: $VERSION"
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Capture Source master HEAD SHA

        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # ── Checkout Masquerade-Emulator ──────────────────────────────────────
      - name: Checkout Masquerade-Emulator

        uses: actions/checkout@v4
        with:
          repository: ${{ env.EMULATOR_REPO }}
          token: ${{ secrets.EMULATOR_REPO_PAT }}
          fetch-depth: 0
          submodules: recursive
          path: emulator-repo

      # ── RELEASE FLOW PATH ─────────────────────────────────────────────────
      - name: '[Release flow] Checkout existing release branch and update submodule'
        if: github.event.inputs.triggered_by_release == 'true'
        working-directory: emulator-repo
        run: |
          BRANCH="release/${{ steps.version.outputs.value }}"

          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "❌ Branch $BRANCH not found in Masquerade-Emulator."
            echo "This usually means release.yml did not run or failed before creating the Emulator PR."
            exit 1
          fi

          git checkout "$BRANCH"
          echo "✅ Checked out $BRANCH"

          cd src
          # Fetch the specific commit SHA explicitly — a plain 'git fetch origin'
          # only fetches branch tips and may not include the exact SHA we need
          git fetch origin ${{ steps.source.outputs.sha }}
          git checkout ${{ steps.source.outputs.sha }}
          cd ..

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "chore: update src/ submodule to ${{ steps.version.outputs.value }} (${{ steps.source.outputs.sha }})"
          git push origin "$BRANCH"
          echo "✅ Submodule updated on $BRANCH"

      - name: '[Release flow] Set SUCCESS status to unblock Emulator PR'
        if: github.event.inputs.triggered_by_release == 'true'
        run: |
          EMULATOR_SHA=$(cd emulator-repo && git rev-parse HEAD)
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.EMULATOR_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ env.EMULATOR_REPO }}/statuses/$EMULATOR_SHA \
            -d "{
              \"state\": \"success\",
              \"context\": \"submodule-update\",
              \"description\": \"src/ submodule updated to ${{ steps.version.outputs.value }} — ready to merge\"
            }"
          echo "✅ Emulator PR merge button unblocked"

      # ── STANDALONE PATH (workflow_dispatch) ───────────────────────────────
      - name: '[Standalone] Create new branch and update submodule'
        if: github.event.inputs.triggered_by_release != 'true'
        working-directory: emulator-repo
        run: |
          BRANCH="submodule-update/${{ steps.version.outputs.value }}-$(date +%Y%m%d%H%M%S)"
          echo "STANDALONE_BRANCH=$BRANCH" >> $GITHUB_ENV

          git checkout -b "$BRANCH"
          echo "✅ Created branch $BRANCH"

          cd src
          git fetch origin ${{ steps.source.outputs.sha }}
          git checkout ${{ steps.source.outputs.sha }}
          cd ..

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "chore: update src/ submodule to ${{ steps.version.outputs.value }} (${{ steps.source.outputs.sha }})"
          git push origin "$BRANCH"
          echo "✅ Submodule update pushed to $BRANCH"

      - name: '[Standalone] Open PR in Masquerade-Emulator'
        if: github.event.inputs.triggered_by_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          gh pr create \
            --repo "${{ env.EMULATOR_REPO }}" \
            --title "Update src/ submodule to ${{ steps.version.outputs.value }}" \
            --body "## Submodule update: \`${{ steps.version.outputs.value }}\`

          Updates \`src/\` submodule to point to Masquerade-Source master HEAD:
          \`${{ steps.source.outputs.sha }}\`

          _Triggered manually by @${{ github.actor }} via \`update-submodule.yml\`_" \
            --base main \
            --head "${{ env.STANDALONE_BRANCH }}"
          echo "✅ PR opened"

# ─────────────────────────────────────────────────────────────────────────────
# CLEANUP ON FAILURE  —  release flow only (push trigger)
# If submodule update fails after the Source bump was already merged:
#   1. Revert the version bump commit on Source master
#   2. Delete the Emulator release branch
#   3. Delete the Emulator tag (if created)
#   4. Delete the Source tag (if created)
# This leaves both repos clean so the release can be re-triggered.
# ─────────────────────────────────────────────────────────────────────────────
  cleanup_on_failure:
    name: Revert Source bump and clean Emulator on failure
    needs: update_submodule
    if: failure() && github.event.inputs.triggered_by_release == 'true'
    runs-on: ubuntu-latest
    env:
      EMULATOR_REPO: Kotambail-Hegde/Masquerade-Emulator

    steps:
      - name: Checkout Masquerade-Source master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.EMULATOR_REPO_PAT }}
          fetch-depth: 0

      - name: Resolve version from helpers.h
        id: version
        run: |
          VERSION=$(sed -n 's/.*#define VERSION[[:space:]]*static_cast<float>(\([0-9.]*\)).*/\1/p' helpers/helpers.h)
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Version to revert: $VERSION"

      - name: Revert version bump commit on Source master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Find the most recent commit that touched helpers.h
          BUMP_SHA=$(git log --oneline --diff-filter=M -- helpers/helpers.h | head -1 | awk '{print $1}')
          echo "Reverting commit: $BUMP_SHA"

          git revert --no-edit "$BUMP_SHA"
          git push origin master
          echo "✅ Version bump reverted on Source master"

      - name: Delete Emulator release branch
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          BRANCH="release/${{ steps.version.outputs.value }}"
          if gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ env.EMULATOR_REPO }}/git/ref/heads/$BRANCH \
            > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ env.EMULATOR_REPO }}/git/refs/heads/$BRANCH
            echo "✅ Emulator branch $BRANCH deleted"
          else
            echo "ℹ️  Emulator branch $BRANCH not found — skipping"
          fi

      - name: Delete Emulator tag
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          TAG="${{ steps.version.outputs.value }}"
          if gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ env.EMULATOR_REPO }}/git/ref/tags/$TAG \
            > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ env.EMULATOR_REPO }}/git/refs/tags/$TAG
            echo "✅ Emulator tag $TAG deleted"
          else
            echo "ℹ️  Emulator tag $TAG not found — skipping"
          fi

      - name: Delete Source tag
        env:
          GH_TOKEN: ${{ secrets.EMULATOR_REPO_PAT }}
        run: |
          TAG="${{ steps.version.outputs.value }}"
          if gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/Kotambail-Hegde/Masquerade-Source/git/ref/tags/$TAG \
            > /dev/null 2>&1; then
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              /repos/Kotambail-Hegde/Masquerade-Source/git/refs/tags/$TAG
            echo "✅ Source tag $TAG deleted"
          else
            echo "ℹ️  Source tag $TAG not found — skipping"
          fi
          