<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no" />
    <title>Masquerade</title>
    <style>
        body {
            margin: 0;
            background-color: black
        }
        /* FIXME: with our GLFW example this block seems to break resizing and io.DisplaySize gets stuck */
        .emscripten {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            outline: none;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        var Module = {
            preRun: [],
            postRun: [],
            print: (function () {
                return function (text) {
                    text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                };
            })(),
            printErr: function (text) {
                text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                //canvas.addEventListener("webglcontextlost", function(e) { alert('FIXME: WebGL context lost, please reload the page'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function (text) {
                console.log("status: " + text);
            },
            monitorRunDependencies: function (left) {
                // no run dependencies to log
            }
        };

        // Parse ?roms=COUNT&rom0=...&rom1=... etc.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var romCount = parseInt(params.get("roms") || "0", 10);
            Module.arguments = [];

            for (let i = 0; i < romCount; ++i) {
                let rom = params.get("rom" + i);
                if (rom) {
                    // Decode URL encoding (handles spaces, capitals, numbers, special chars)
                    rom = decodeURIComponent(rom);

                    // GH-Pages fix: remove leading slash in URL parameter
                    rom = rom.replace(/^\//, "");

                    // Add slash back because Emscripten paths must start with /
                    rom = "/" + rom;

                    Module.arguments.push(rom);
                    console.log('ROM argument added: ' + rom);
                }
            }
        })();

        window.onerror = function (event) {
            console.log("onerror: " + event);
        };
    </script>

    <script type="text/javascript">
        // Dismiss the splash from a real DOM gesture (independent of SDL's focus state), and make sure the canvas has focus.
        // Firefox may never send 'mouseenter' when the pointer is already over the canvas at load (e.g. after a reload for a new game),
        // so SDL never gets mouse focus; we send one ourselves on the first gesture.
        (function () {
            var canvas = document.getElementById('canvas');
            var dismissed = false;
            var enterSent = false;

            function focusCanvas() {
                if (canvas && document.activeElement !== canvas) canvas.focus({ preventScroll: true });
            }
            function sendEnter(e) {
                if (enterSent || !canvas) return;
                enterSent = true;
                canvas.dispatchEvent(new MouseEvent('mouseenter', {
                    bubbles: false, clientX: e.clientX || 0, clientY: e.clientY || 0
                }));
            }
            var focusDispatched = false;
            function tellAppItIsFocused() {
                if (!Module.calledRun) return;
                if (!focusDispatched) {
                    // let SDL see a real 'focus' event too (its keyboard focus); canvas.focus() alone never reaches SDL's window-level listener
                    focusDispatched = true;
                    window.dispatchEvent(new FocusEvent('focus'));
                }
                Module.ccall('masq_page_focused', null, [], []);
            }
            function onGesture(e) {
                focusCanvas();
                sendEnter(e);
                tellAppItIsFocused();
                if (dismissed || !Module.calledRun) return; // runtime not ready yet: wait for the next gesture
                dismissed = true;
                Module.ccall('masq_dismiss_splash', null, [], []);
            }

            canvas.setAttribute('tabindex', '0');
            ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (t) {
                window.addEventListener(t, onGesture, true);
            });
            window.addEventListener('mousemove', sendEnter, { once: true, capture: true });
            window.addEventListener('load', focusCanvas);
            document.addEventListener('visibilitychange', function () { if (!document.hidden) { focusCanvas(); tellAppItIsFocused(); } });
        })();
    </script>

    {{{ SCRIPT }}}
</body>
</html>
